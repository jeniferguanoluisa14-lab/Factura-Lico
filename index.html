<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura</title>
    <script src="factura.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-xs bg-warning p-2">
        <h2>Factura Lico 5toA</h2>
    </div>

    <section class="m-3">
        <!--info cliente-->
        <div class="bg-secondary p-3 text-white">
            <label>Nombre Cliente</label>
            <input type="text" id="nombreCliente"/>
            <label>Cédula</label>
            <input type="text" id="cedulaCliente"/>
            <label>Sexo</label>
            <input type="text" id="sexoCliente"/>
        </div>
    </section>

    <section class="m-3">
        <!--info producto-->
        <div>
            <div class="bg-success p-3 text-white mb-3">
                <h4>Agregar Producto</h4>
                <label>Producto</label>
                <input type="text" id="nombreProducto"/>
                <label>Cantidad</label>
                <input type="number" id="cantidadProducto"/>
                <label>Precio</label>
                <input type="number" step="0.01" id="precioProducto"/>
                <button id="agregarProducto" class="btn btn-light btn-sm">Agregar</button>
            </div>

            <h5>Lista de Productos</h5>
            <table border="3" class="table table-bordered">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="DetalleFactura"></tbody>
            </table>
        </div>
    </section>

    <section class="m-3">
        <!--inf de los totales en otra tabla sin span-->
        <div class="bg-secondary p-3 text-white">
            <h4>Resumen factura</h4>
            <table border="3" class="table table-bordered text-white">
                <tbody>
                    <tr>
                        <th>Subtotal</th>
                        <td id="resumenSubtotal">0.00</td>
                    </tr>
                    <tr>
                        <th>IVA</th>
                        <td id="resumenIVA">0.00</td>
                    </tr>
                    <tr>
                        <th>TOTAL</th>
                        <td id="resumenTotal">0.00</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</body>
</html>
